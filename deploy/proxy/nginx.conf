# Hexagon behind nginx. This file is included from inside http {}, which is why
# map and limit_conn_zone are legal here.

# The terminal, the Claude login terminal and code-server's own socket are all
# WebSockets. Without this map — and the proxy_http_version and the two headers
# below — the handshake fails, and that is the single most common way a reverse
# proxy in front of this application is wrong.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# One client should not be able to occupy every worker connection. This is where
# the connection limit lives: at the edge, where it can refuse without occupying
# anything. Hexagon deliberately has none of its own.
limit_conn_zone $binary_remote_addr zone=hexagon_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name hexagon.example;

    # No application traffic over plaintext, ever.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hexagon.example;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS is deliberately not set here: Hexagon emits it itself, gated on its
    # own public URL, so it is correct whatever is in front. Setting it in both
    # places is how a max-age ends up disagreeing with itself.

    limit_conn hexagon_conn 32;

    # The API's own bounds are much smaller (an image request is capped at
    # 256 KiB), but code-server uploads files through here, and nginx's 1 MiB
    # default would truncate them.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Hexagon compares the request's origin against its publicUrl and builds
        # the OAuth callback from it. Rewriting the host breaks both.
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Real-IP         $remote_addr;
        # Hexagon reads the last entry, which is the one this proxy appended.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nginx's default is 60 seconds, which silently closes an idle terminal.
        # Hexagon pings every 30, so 60 would usually survive — and the failure
        # would be intermittent, which is worse than never working.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Terminal output is a stream; buffered, it arrives in bursts.
        proxy_buffering off;
    }
}
