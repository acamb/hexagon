<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The mark is drawn for a light background and recoloured for a dark one;
         the tab strip follows the browser theme, so both are offered. A browser
         that ignores the media attribute takes the last, which is the original. -->
    <link rel="icon" type="image/png" href="/favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon.png" media="(prefers-color-scheme: light)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hexagon</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
